# FitSync — Nginx reverse proxy + static frontend
# Copy to e.g. /etc/nginx/sites-available/fitsync and symlink sites-enabled.
# Adjust root, server_name, and upstream port to match your server.
#
# Deploy tree example:
#   /var/www/fitsync/   ← index.html, style.css, src/, assets (same as project root)
#
# Start API:
#   gunicorn -c deploy/gunicorn.conf.py "server:app"

upstream fitsync_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name fitsync.example.com;

    # --- Static FitSync UI (HTML, CSS, ES modules under /src/) ---
    root /var/www/fitsync;
    index index.html;

    # Cache immutable-looking assets lightly; tune for your CDN / build output
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Flask API (Gunicorn) ---
    location /api/ {
        proxy_pass http://fitsync_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

